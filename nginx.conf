user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    index index.html;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        server_name nekrologi.soiree.tech;
        root /srv/sobituaries/website/;

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location /api/ {
            proxy_pass https://backend;
        }

        location /admin/ {
            proxy_pass https://backend;
        }

        location /static/ {
            alias /srv/sobituaries/sobituaries/static/;
        }

        listen [::]:443 ssl http2 ipv6only=on;
        listen 443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/nekrologi.soiree.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nekrologi.soiree.tech/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }

    server {
        if ($host = nekrologi.soiree.tech) {
            return 301 https://$host$request_uri;
        }

        listen 80;
        listen [::]:80;
        server_name nekrologi.soiree.tech;
        return 404;
    }
}
